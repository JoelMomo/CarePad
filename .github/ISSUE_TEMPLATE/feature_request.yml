name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case before proposing the implementation.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
      description: What would you like the project to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
