name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  build:
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload baseline module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-baseline-debug
          path: module-lab/build/outputs/apk/debug/module-lab-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build update module lab APK
        run: ./gradlew :module-lab:clean :module-lab:assembleDebug -PcarepadModuleLabVersionCode=2 -PcarepadModuleLabVersionName=0.2-lab --stacktrace

      - name: Upload update module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-update-debug
          path: module-lab/build/outputs/apk/debug/module-lab-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build incompatible-protocol module lab APK
        run: ./gradlew :module-lab:clean :module-lab:assembleDebug -PcarepadModuleLabVersionCode=3 -PcarepadModuleLabVersionName=0.3-incompatible -PcarepadModuleLabProtocolMin=2 -PcarepadModuleLabProtocolMax=2 --stacktrace

      - name: Upload incompatible-protocol module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-incompatible-protocol-debug
          path: module-lab/build/outputs/apk/debug/module-lab-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build wrong-signature module lab APK
        run: ./gradlew :module-lab:clean :module-lab:assembleRelease -PcarepadModuleLabVersionCode=4 -PcarepadModuleLabVersionName=0.4-wrong-signature --stacktrace

      - name: Sign module lab APK with unrelated CI key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/carepad-wrong-signer.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias wrong-signer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CarePad CI Wrong Signer,O=CarePad Lab,C=ES"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/carepad-wrong-signer.jks" \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out "$RUNNER_TEMP/module-lab-wrong-signature.apk" \
            module-lab/build/outputs/apk/release/module-lab-release-unsigned.apk
          "$APKSIGNER" verify "$RUNNER_TEMP/module-lab-wrong-signature.apk"

      - name: Upload wrong-signature module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-wrong-signature
          path: ${{ runner.temp }}/module-lab-wrong-signature.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build defective update module lab APK
        run: ./gradlew :module-lab:clean :module-lab:assembleDebug -PcarepadModuleLabVersionCode=5 -PcarepadModuleLabVersionName=0.5-broken -PcarepadModuleLabAlwaysCrash=true --stacktrace

      - name: Upload defective update module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-defective-update-debug
          path: module-lab/build/outputs/apk/debug/module-lab-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build parallel CarePad lab host
        run: ./gradlew :app:assembleDebug -PcarepadLabHost=true --stacktrace

      - name: Upload parallel CarePad lab host
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-host-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Generic Android regression coverage; OEM/hardware checks stay on real devices.
  android-emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure AVD home
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/carepad-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/carepad-avd"

      - name: Download CarePad lab host
        uses: actions/download-artifact@v4
        with:
          name: CarePad-host-lab-debug
          path: artifacts/host

      - name: Download baseline module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-baseline-debug
          path: artifacts/module-baseline

      - name: Download update module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-update-debug
          path: artifacts/module-update

      - name: Download incompatible-protocol module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-incompatible-protocol-debug
          path: artifacts/module-incompatible-protocol

      - name: Download wrong-signature module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-wrong-signature
          path: artifacts/module-wrong-signature

      - name: Download defective update module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-defective-update-debug
          path: artifacts/module-defective-update

      - name: Install Android emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Create Android virtual device
        run: |
          echo no | avdmanager create avd \
            --force \
            --name carepad-ci \
            --package "system-images;android-35;google_apis;x86_64"

      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Start Android emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd carepad-ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/carepad-emulator.log" 2>&1 &

      - name: Run CarePad module smoke test
        run: |
          chmod +x scripts/ci/android-emulator-module-smoke.sh
          scripts/ci/android-emulator-module-smoke.sh \
            "$(find artifacts/host -name '*.apk' -print -quit)" \
            "$(find artifacts/module-baseline -name '*.apk' -print -quit)" \
            "$(find artifacts/module-update -name '*.apk' -print -quit)" \
            "$(find artifacts/module-incompatible-protocol -name '*.apk' -print -quit)" \
            "$(find artifacts/module-wrong-signature -name '*.apk' -print -quit)" \
            "$(find artifacts/module-defective-update -name '*.apk' -print -quit)"

      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-emulator-log
          path: ${{ runner.temp }}/carepad-emulator.log
          if-no-files-found: ignore
          retention-days: 7
