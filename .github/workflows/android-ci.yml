name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest :performance-runtime:testDebugUnitTest :games-bios-runtime:testDebugUnitTest :controls-runtime:testDebugUnitTest --stacktrace

  build:
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :module-lab:assembleDebug :performance-module:assembleDebug :performance-emulator-fixture:assembleDebug :controls-input-lab:assembleDebug --stacktrace

      - name: Build CarePad focus androidTest APK
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Build Performance release APK for LAB isolation
        run: ./gradlew :performance-module:assembleRelease --stacktrace

      - name: Verify Performance LAB debug/release isolation
        run: |
          if grep -R -n --fixed-strings "PerformanceLabControlReceiver" modules/performance/app/src/main; then
            echo "PerformanceLabControlReceiver must not exist in src/main" >&2
            exit 1
          fi

          DEBUG_APK="$(find modules/performance/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          RELEASE_APK="$(find modules/performance/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"

          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          fi
          test -n "$APKANALYZER"
          test -x "$APKANALYZER"

          "$APKANALYZER" manifest print "$DEBUG_APK" > "$RUNNER_TEMP/performance-debug-manifest.xml"
          "$APKANALYZER" manifest print "$RELEASE_APK" > "$RUNNER_TEMP/performance-release-manifest.xml"

          python3 - \
            "$RUNNER_TEMP/performance-debug-manifest.xml" \
            "$RUNNER_TEMP/performance-release-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ANDROID = "{http://schemas.android.com/apk/res/android}"
          RECEIVER = "dev.carepad.module.performance.PerformanceLabControlReceiver"
          SERVICE = "dev.carepad.module.performance.PerformanceMonitorService"

          def components(path, tag):
              root = ET.parse(path).getroot()
              application = root.find("application")
              if application is None:
                  raise AssertionError(f"application missing in {path}")
              return {
                  node.attrib.get(ANDROID + "name"): node
                  for node in application.findall(tag)
              }

          debug_receivers = components(sys.argv[1], "receiver")
          release_receivers = components(sys.argv[2], "receiver")
          debug_services = components(sys.argv[1], "service")
          release_services = components(sys.argv[2], "service")

          assert RECEIVER in debug_receivers, debug_receivers.keys()
          assert debug_receivers[RECEIVER].attrib.get(ANDROID + "exported") == "true"
          assert RECEIVER not in release_receivers, release_receivers.keys()

          assert SERVICE in debug_services, debug_services.keys()
          assert SERVICE in release_services, release_services.keys()
          assert debug_services[SERVICE].attrib.get(ANDROID + "exported") == "true"
          assert release_services[SERVICE].attrib.get(ANDROID + "exported") == "false"

          print("Performance LAB isolation verified: receiver=debug-only, service debug exported=true/release exported=false")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload CarePad focus androidTest APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-focus-androidTest-debug
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload baseline module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-baseline-debug
          path: module-lab/build/outputs/apk/debug/module-lab-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Performance module APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-performance-module-debug
          path: modules/performance/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Performance emulator fixture APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-performance-emulator-fixture-debug
          path: test-fixtures/performance-emulator/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Controls input lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-controls-input-lab-debug
          path: test-fixtures/controls-input-lab/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Build update module lab APK
        run: ./gradlew :module-lab:clean :module-lab:assembleDebug -PcarepadModuleLabVersionCode=2 -PcarepadModuleLabVersionName=0.2-lab --stacktrace

      - name: Upload update module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-update-debug
          path: module-lab/build/outputs/apk/debug/module-lab-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Build incompatible-protocol module lab APK
        run: ./gradlew :module-lab:clean :module-lab:assembleDebug -PcarepadModuleLabVersionCode=3 -PcarepadModuleLabVersionName=0.3-incompatible -PcarepadModuleLabProtocolMin=2 -PcarepadModuleLabProtocolMax=2 --stacktrace

      - name: Upload incompatible-protocol module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-incompatible-protocol-debug
          path: module-lab/build/outputs/apk/debug/module-lab-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Build wrong-signature module lab APK
        run: ./gradlew :module-lab:clean :module-lab:assembleRelease -PcarepadModuleLabVersionCode=4 -PcarepadModuleLabVersionName=0.4-wrong-signature --stacktrace

      - name: Sign module lab APK with unrelated CI key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/carepad-wrong-signer.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias wrong-signer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CarePad CI Wrong Signer,O=CarePad Lab,C=ES"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/carepad-wrong-signer.jks" \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out "$RUNNER_TEMP/module-lab-wrong-signature.apk" \
            module-lab/build/outputs/apk/release/module-lab-release-unsigned.apk
          "$APKSIGNER" verify "$RUNNER_TEMP/module-lab-wrong-signature.apk"

      - name: Upload wrong-signature module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-wrong-signature
          path: ${{ runner.temp }}/module-lab-wrong-signature.apk
          if-no-files-found: error
          retention-days: 3

      - name: Build defective update module lab APK
        run: ./gradlew :module-lab:clean :module-lab:assembleDebug -PcarepadModuleLabVersionCode=5 -PcarepadModuleLabVersionName=0.5-broken -PcarepadModuleLabAlwaysCrash=true --stacktrace

      - name: Upload defective update module lab APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-module-lab-defective-update-debug
          path: module-lab/build/outputs/apk/debug/module-lab-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Build parallel CarePad lab host and focus androidTest
        run: ./gradlew :app:clean :app:assembleDebug :app:assembleDebugAndroidTest -PcarepadLabHost=true --stacktrace

      - name: Verify parallel CarePad lab focus androidTest target
        run: |
          LAB_HOST_APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          LAB_TEST_APK="$(find app/build/outputs/apk/androidTest/debug -name '*-androidTest.apk' -print -quit)"
          test -n "$LAB_HOST_APK"
          test -n "$LAB_TEST_APK"

          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          fi
          test -n "$APKANALYZER"
          test -x "$APKANALYZER"

          "$APKANALYZER" manifest print "$LAB_HOST_APK" > "$RUNNER_TEMP/carepad-lab-host-manifest.xml"
          "$APKANALYZER" manifest print "$LAB_TEST_APK" > "$RUNNER_TEMP/carepad-lab-androidTest-manifest.xml"

          python3 - \
            "$RUNNER_TEMP/carepad-lab-host-manifest.xml" \
            "$RUNNER_TEMP/carepad-lab-androidTest-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ANDROID = "{http://schemas.android.com/apk/res/android}"
          EXPECTED = "com.joel.thordoctor.carepadlabhost"

          host = ET.parse(sys.argv[1]).getroot()
          test = ET.parse(sys.argv[2]).getroot()
          instrumentation = test.find("instrumentation")
          if instrumentation is None:
              raise AssertionError("instrumentation missing from LAB androidTest manifest")

          host_package = host.attrib.get("package")
          target_package = instrumentation.attrib.get(ANDROID + "targetPackage")
          assert host_package == EXPECTED, (host_package, EXPECTED)
          assert target_package == EXPECTED, (target_package, EXPECTED)

          print(f"CarePad LAB pair verified: hostPackage={host_package}, targetPackage={target_package}")
          PY

      - name: Upload parallel CarePad lab host
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-host-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload parallel CarePad lab focus androidTest APK
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-focus-androidTest-lab-debug
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  # Generic Android regression coverage plus lab-only recovery execution.
  android-emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure AVD home
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/carepad-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/carepad-avd"

      - name: Download normal CarePad debug host
        uses: actions/download-artifact@v4
        with:
          name: CarePad-debug
          path: artifacts/host-normal

      - name: Download CarePad focus androidTest APK
        uses: actions/download-artifact@v4
        with:
          name: CarePad-focus-androidTest-debug
          path: artifacts/focus-androidTest

      - name: Download CarePad lab host
        uses: actions/download-artifact@v4
        with:
          name: CarePad-host-lab-debug
          path: artifacts/host

      - name: Download baseline module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-baseline-debug
          path: artifacts/module-baseline

      - name: Download update module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-update-debug
          path: artifacts/module-update

      - name: Download incompatible-protocol module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-incompatible-protocol-debug
          path: artifacts/module-incompatible-protocol

      - name: Download wrong-signature module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-wrong-signature
          path: artifacts/module-wrong-signature

      - name: Download defective update module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-module-lab-defective-update-debug
          path: artifacts/module-defective-update

      - name: Download Performance module
        uses: actions/download-artifact@v4
        with:
          name: CarePad-performance-module-debug
          path: artifacts/performance-module

      - name: Download Performance emulator fixture
        uses: actions/download-artifact@v4
        with:
          name: CarePad-performance-emulator-fixture-debug
          path: artifacts/performance-emulator-fixture

      - name: Install Android emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Create Android virtual device
        run: |
          echo no | avdmanager create avd \
            --force \
            --name carepad-ci \
            --package "system-images;android-35;google_apis;x86_64"

      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Start Android emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd carepad-ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/carepad-emulator.log" 2>&1 &

      - name: Run CarePad focus Compose tests
        run: |
          chmod +x scripts/ci/android-emulator-focus-compose.sh
          scripts/ci/android-emulator-focus-compose.sh \
            "$(find artifacts/host-normal -name '*.apk' -print -quit)" \
            "$(find artifacts/focus-androidTest -name '*.apk' -print -quit)"

      - name: Run CarePad module smoke test
        run: |
          chmod +x scripts/ci/android-emulator-module-smoke.sh
          scripts/ci/android-emulator-module-smoke.sh \
            "$(find artifacts/host -name '*.apk' -print -quit)" \
            "$(find artifacts/module-baseline -name '*.apk' -print -quit)" \
            "$(find artifacts/module-update -name '*.apk' -print -quit)" \
            "$(find artifacts/module-incompatible-protocol -name '*.apk' -print -quit)" \
            "$(find artifacts/module-wrong-signature -name '*.apk' -print -quit)" \
            "$(find artifacts/module-defective-update -name '*.apk' -print -quit)" \
            "$(find artifacts/performance-module -name '*.apk' -print -quit)" \
            "$(find artifacts/performance-emulator-fixture -name '*.apk' -print -quit)"

      - name: Run AndroidModuleRecovery lab smoke test
        run: |
          chmod +x scripts/ci/android-emulator-recovery-smoke.sh
          scripts/ci/android-emulator-recovery-smoke.sh \
            "$(find artifacts/host-normal -name '*.apk' -print -quit)" \
            "$(find artifacts/host -name '*.apk' -print -quit)" \
            "$(find artifacts/module-update -name '*.apk' -print -quit)" \
            "$(find artifacts/module-defective-update -name '*.apk' -print -quit)"

      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CarePad-emulator-log
          path: ${{ runner.temp }}/carepad-emulator.log
          if-no-files-found: ignore
          retention-days: 7
